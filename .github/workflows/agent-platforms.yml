# The PC agent on every system it supports: the screen capture on real
# Windows and macOS machines, the Linux installer + capture on the big
# distributions, and the Wayland portal on a real wlroots desktop.
name: Agent on every platform

on:
  push:
    branches: [main, feat/60fps-live-typing-remote-access]
    paths:
      - agent/**
      - scripts/test_capture.py
      - scripts/test_portal_live.py
      - scripts/test_wayland_portal.py
      - scripts/ci_wlroots.sh
      - .github/workflows/agent-platforms.yml
  workflow_dispatch:

jobs:
  desktop:
    name: Capture on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r agent/requirements.txt
      - run: python -I scripts/test_capture.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ matrix.os }}
          path: out

  linux-distro:
    name: Install + capture on ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, ubuntu:26.04, debian:13, fedora:latest,
                archlinux:latest, opensuse/tumbleweed]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      SUDO_AGENT_NO_SERVICE: "1"
      CI: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the agent (agent/linux/install.sh)
        run: bash agent/linux/install.sh
      - name: Test display (Xvfb)
        run: |
          if command -v apt-get >/dev/null; then apt-get install -y xvfb x11-xserver-utils
          elif command -v dnf >/dev/null; then dnf install -y xorg-x11-server-Xvfb xsetroot
          elif command -v zypper >/dev/null; then zypper --non-interactive install xorg-x11-server-Xvfb xsetroot
          else pacman -S --needed --noconfirm xorg-server-xvfb xorg-xsetroot; fi
      - name: Capture on X11 (black screen -> notice, then the picture)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          DISPLAY=:99 ~/.local/share/sudo-agent/venv/bin/python -I scripts/test_capture.py out --black-first
      - name: Portal tests (PyGObject, GStreamer, dbus-fast, uinput bytes)
        run: ~/.local/share/sudo-agent/venv/bin/python -I scripts/test_wayland_portal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ strategy.job-index }}
          path: out

  wlroots-wayland:
    name: Wayland portal on Sway (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        # Each ships its own wlroots / xdg-desktop-portal-wlr version.
        image: [archlinux:latest, debian:13, fedora:latest]
    runs-on: ubuntu-latest
    # Debian 13's xdg-desktop-portal-wlr 0.7 can't capture a GPU-less
    # headless output ("unable to receive a valid format from
    # wlr_screencopy"; Ubuntu 24.04's the same). On a real PC it shares the
    # screen; here the run shows the result without failing the workflow.
    continue-on-error: ${{ matrix.image == 'debian:13' }}
    # Sway runs as a normal user (it won't run as root).
    container: ${{ matrix.image }}
    env:
      CI: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Sway, PipeWire, portals, a normal user
        run: |
          if command -v pacman >/dev/null; then
              pacman -Syu --needed --noconfirm sway swaybg xdg-desktop-portal \
                  xdg-desktop-portal-wlr pipewire wireplumber dbus sudo
          elif command -v apt-get >/dev/null; then
              apt-get update -qq
              apt-get install -y sway swaybg xdg-desktop-portal xdg-desktop-portal-wlr \
                  pipewire wireplumber dbus sudo
          else
              dnf install -y sway swaybg xdg-desktop-portal xdg-desktop-portal-wlr \
                  pipewire wireplumber dbus-daemon dbus-tools sudo util-linux
          fi
          # Arch's sway carries a file capability (cap_sys_nice), which a
          # container may not exec; a plain copy has none.
          cp "$(command -v sway)" /usr/local/bin/sway
          useradd -m tester
          echo "tester ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Install the agent as that user (agent/linux/install.sh)
        run: runuser -u tester -- env SUDO_AGENT_NO_SERVICE=1 CI=1 bash agent/linux/install.sh
      - name: Portal session (ScreenCast only) and a PipeWire frame
        run: |
          runuser -u tester -- env HOME=/home/tester \
              PY=/home/tester/.local/share/sudo-agent/venv/bin/python \
              dbus-run-session -- bash scripts/ci_wlroots.sh out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wlroots-wayland-${{ strategy.job-index }}
          path: out

  virtual-input:
    name: Virtual mouse and keyboard (uinput)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: /dev/uinput for the runner
        run: |
          sudo modprobe uinput
          sudo chmod 666 /dev/uinput
      - name: The device appears and takes events
        run: |
          python -I - <<'EOF'
          import sys, time
          sys.path.insert(0, "agent")
          import uinput_input as ui
          dev = ui.VirtualInput()
          dev._wtype = None
          dev.move_rel(10, 5)
          dev.button("left", True)
          dev.button("left", False)
          dev.scroll(0, 1)
          dev.key("enter")
          dev.text("Hi!")
          listed = "Sudo remote input" in open("/proc/bus/input/devices").read()
          print("listed by the kernel:", listed)
          dev.close()
          assert listed
          print("PASS")
          EOF
